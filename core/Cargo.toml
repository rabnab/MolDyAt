[package]
name = "moldyat_core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The simulation physics (#308).
thermo_physics = { path = "../crates/thermo_physics", default-features = false }
# The physics thread, commands and snapshots (#309).
thermo_runtime = { path = "../crates/thermo_runtime", default-features = false }

# Snapshot slot read by the renderer (`PhysicsCoordinator`)
arc-swap = "1.7"

# Logging
log = "0.4"
env_logger = "0.11"

# Window management (energy plot uses softbuffer + winit)
winit = "0.30.12"
softbuffer = "0.4"

[dev-dependencies]
float-cmp = "0.10"
thermo_physics = { path = "../crates/thermo_physics", default-features = false, features = ["test-support"] }

[features]
default = ["measure-time"]
# The F4 step-timing log, in thermo_physics.
measure-time = ["thermo_physics/measure-time", "thermo_runtime/measure-time"]
