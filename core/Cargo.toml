[package]
name = "moldyat_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Physics & simulation
rand = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.10.0"
arc-swap = "1.7"

# Save/load of the simulation world (#50)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Window management (energy plot uses softbuffer + winit)
winit = "0.30.12"
softbuffer = "0.4"

# Interpolation for T/P field upsampling (#116)
scirs2-interpolate = { version = "0.4", features = ["simd", "linalg"] }
ndarray = "0.17"

[dev-dependencies]
float-cmp = "0.10"

[features]
default = ["measure-time"]
measure-time = []
