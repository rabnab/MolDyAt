[package]
name = "rust_thermo_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
# Physics & simulation
rand = "0.10.0"
rand_distr = "0.6.0"
lru = "0.16.2"
rayon = "1.10.0"
wide = "1.1"
num_cpus = "1.16"
arc-swap = "1.7"

# Logging
log = "0.4"
env_logger = "0.11"

# Window management (energy plot uses softbuffer + winit)
winit = "0.30.12"
softbuffer = "0.4"

[dev-dependencies]
float-cmp = "0.10"

[features]
default = ["measure-time"]
measure-time = []
