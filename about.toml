# cargo-about configuration: generates THIRD_PARTY_LICENSES.md for release archives.
# Regenerate with: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md
# Keep `accepted` in sync with `[licenses] allow` in deny.toml.
accepted = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
# Only crates compiled into the release binaries (see .github/workflows/release.yml).
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
