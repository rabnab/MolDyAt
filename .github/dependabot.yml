# Dependabot version updates. Security updates are configured separately in the
# repository settings (Code security).
version: 2
updates:
  # Rust dependencies. Floating-point results (drift baselines) can shift with
  # a dependency update, so updates are monthly and grouped; the CI drift and
  # regression suites run on every pull request.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
