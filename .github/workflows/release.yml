name: Release

on:
  push:
    tags:
      - "v*"          # e.g. v1.3.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.3.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_NIGHTLY: "nightly-2026-09-01" # keep in sync with rust-toolchain.toml
  PKG: moldyat_wgpu # cargo package
  BIN: moldyat # binary name, also the archive prefix
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: verify release files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about

      - name: Check dependency licenses
        run: cargo deny check licenses

      # Also checks that the tag matches the Cargo.toml version (uses $TAG).
      - name: Check license headers, notices and release metadata
        run: scripts/check_release_files.sh

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # Licenses and copyright notices of the dependencies compiled into the
      # binary; shipped in the archive (see about.toml and about.hbs).
      - name: Generate third-party notices
        shell: bash
        run: cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.md

      - name: Build
        run: cargo build --locked -p ${{ env.PKG }} --profile dist --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/${BIN}${{ matrix.ext }}" "dist/$name/"
          cp README.md LICENSE THIRD_PARTY_LICENSES.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          sha256sum "$name.${{ matrix.archive }}" > "$name.${{ matrix.archive }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Tags with a SemVer suffix (v1.4.0-rc.1) become pre-releases.
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" dist/* "${prerelease[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
