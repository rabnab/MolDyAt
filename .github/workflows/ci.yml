name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_NIGHTLY: "nightly-2026-09-01" # keep in sync with rust-toolchain.toml

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: clippy (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    #only needed for upload sarif
    #permissions:
    #  contents: read
    #  security-events: write
    #  actions: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install clippy-sarif and sarif-fmt
        uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run clippy
        run: |
          set -o pipefail
          cargo ci-clippy | clippy-sarif | tee clippy-results.sarif | sarif-fmt

      # only in public repo or for organisations
      #- name: Upload clippy SARIF
      #  if: always()
      #  uses: github/codeql-action/upload-sarif@v4
      #  with:
      #    sarif_file: clippy-results.sarif

  test:
    name: tests (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/nextest/ci/junit.xml

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  headless-regression:
    name: headless regression (wgpu fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Run seeded headless regression fixture
        shell: bash
        run: |
          set -o pipefail
          cargo ci-test-headless-regression | tee headless-regression.log

      - name: Upload headless regression log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-regression-log
          path: headless-regression.log

  drift:
    name: drift harness (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Run drift harness tests with scenario summaries
        shell: bash
        run: |
          set -o pipefail
          cargo ci-test-drift | tee drift-harness.log

      - name: Upload drift harness log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: drift-harness-log
          path: drift-harness.log