name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_NIGHTLY: "nightly-2026-09-01" # keep in sync with rust-toolchain.toml

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: clippy (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    #only needed for upload sarif
    #permissions:
    #  contents: read
    #  security-events: write
    #  actions: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install clippy-sarif and sarif-fmt
        uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run clippy
        run: |
          set -o pipefail
          cargo ci-clippy | clippy-sarif | tee clippy-results.sarif | sarif-fmt

      # only in public repo or for organisations
      #- name: Upload clippy SARIF
      #  if: always()
      #  uses: github/codeql-action/upload-sarif@v4
      #  with:
      #    sarif_file: clippy-results.sarif

  test:
    name: tests (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/nextest/ci/junit.xml

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  headless-regression:
    name: headless regression (wgpu fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Run seeded headless regression fixture
        shell: bash
        run: |
          set -o pipefail
          cargo ci-test-headless-regression | tee headless-regression.log

      - name: Upload headless regression log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-regression-log
          path: headless-regression.log

  drift:
    name: drift harness (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Log runner CPU and SIMD path
        shell: bash
        run: |
          # f32 drift baselines depend on the SIMD path. std::simd picks it at
          # compile time from the target features; the host flags are logged
          # too, so a runner-image change can be told apart from a physics change.
          arch=$(uname -m)
          flags=$(grep -m1 -E '^(flags|Features)' /proc/cpuinfo || true)
          simd=unknown
          for f in avx512f avx2 sse4_2 sse2 asimd; do
            if grep -qw "$f" <<<"$flags"; then simd=$f; break; fi
          done
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || true)
          features=$(rustc --print cfg | sed -n 's/^target_feature="\(.*\)"$/\1/p' | paste -sd, -)
          echo "arch=$arch best_host_simd=$simd cpu=${model:-unknown} compiled_features=$features"
          {
            echo "### Drift runner"
            echo ""
            echo "- arch: \`$arch\`"
            echo "- best host SIMD flag: \`$simd\`"
            echo "- compiled target features (decide the SIMD path): \`$features\`"
            echo "- CPU: ${model:-unknown}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run drift harness tests with scenario summaries
        shell: bash
        run: |
          set -o pipefail
          cargo ci-test-drift | tee drift-harness.log

      - name: Publish drift metrics summary
        if: always()
        shell: bash
        run: |
          [ -f drift-harness.log ] || exit 0
          {
            echo "### Drift scenarios"
            echo ""
            echo '```'
            grep '^DRIFT_SCENARIO' drift-harness.log || echo "no DRIFT_SCENARIO lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Metrics above 70% of their threshold pass, but are annotated so
          # shrinking margins are visible before they fail.
          if grep -q '^DRIFT_WARNING' drift-harness.log; then
            {
              echo ""
              echo "### Near-threshold warnings"
              echo ""
              echo '```'
              grep '^DRIFT_WARNING' drift-harness.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep '^DRIFT_WARNING' drift-harness.log | while read -r line; do
              echo "::warning title=Drift metric near threshold::${line#DRIFT_WARNING }"
            done
          fi

      - name: Upload drift harness log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-harness-log
          path: drift-harness.log