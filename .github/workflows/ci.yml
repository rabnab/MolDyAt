name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_NIGHTLY: "nightly-2026-09-01" # keep in sync with rust-toolchain.toml

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
          toolchain: ${{ env.RUST_NIGHTLY }}

      # cargo fmt does not build anything, so no cache.
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: clippy (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    #only needed for upload sarif
    #permissions:
    #  contents: read
    #  security-events: write
    #  actions: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install clippy-sarif and sarif-fmt
        uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run clippy
        run: |
          set -o pipefail
          cargo ci-clippy | clippy-sarif | tee clippy-results.sarif | sarif-fmt

      # The step timing has one code path; this keeps the build without the
      # `measure-time` log compiling and warning-free (#225). Its code is in
      # thermo_physics; thermo_runtime and thermo_ui only pass the feature on.
      - name: Run clippy without measure-time
        run: cargo clippy -p thermo_physics --all-targets --no-default-features -- -D warnings

      # Every step above builds tests, which turn on thermo_physics'
      # `test-support` feature for the whole build (cargo merges features).
      # Lint the binary and the crates it uses without tests, warnings as
      # errors: non-test code that calls a test-only item fails to compile,
      # and code only tests use shows up as dead code (#309).
      - name: Lint the binary without test features
        run: |
          cargo clippy -p moldyat_wgpu -- -D warnings
          cargo clippy -p moldyat_wgpu --no-default-features -- -D warnings

      # only in public repo or for organisations
      #- name: Upload clippy SARIF
      #  if: always()
      #  uses: github/codeql-action/upload-sarif@v4
      #  with:
      #    sarif_file: clippy-results.sarif

  # Licensing and release metadata: dependency licenses (deny.toml), notices
  # file freshness, source headers, version/tag consistency. The same script
  # runs locally: scripts/check_release_files.sh
  licenses:
    name: licenses and release files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about

      - name: Check dependency licenses
        run: cargo deny check licenses

      - name: Check license headers, notices and release metadata
        run: scripts/check_release_files.sh

  # One job builds the test binaries once (nextest and cargo test share them),
  # then runs the unit tests, the seeded headless regression and the drift
  # suite. The ignored suites run even if an earlier step failed, so a
  # unit-test failure still shows the drift and regression results.
  test:
    name: tests (workspace, headless regression, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/nextest/ci/junit.xml

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit

      - name: Run seeded headless regression fixture
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo ci-test-headless-regression | tee headless-regression.log

      # #225: the step timing has one code path, so results must not depend
      # on the `measure-time` feature (it only gates the F4 log in
      # thermo_physics). The headless fixtures run the whole step through
      # thermo_runtime, which passes the feature on.
      - name: Run physics tests and headless fixtures without measure-time
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test -p thermo_physics --no-default-features
          cargo test -p thermo_runtime --no-default-features -- --ignored | tee -a headless-regression.log

      - name: Upload headless regression log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-regression-log
          path: headless-regression.log

      - name: Log runner CPU and SIMD path
        shell: bash
        run: |
          # f32 drift baselines depend on the SIMD path. std::simd picks it at
          # compile time from the target features; the host flags are logged
          # too, so a runner-image change can be told apart from a physics change.
          arch=$(uname -m)
          flags=$(grep -m1 -E '^(flags|Features)' /proc/cpuinfo || true)
          simd=unknown
          for f in avx512f avx2 sse4_2 sse2 asimd; do
            if grep -qw "$f" <<<"$flags"; then simd=$f; break; fi
          done
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || true)
          features=$(rustc --print cfg | sed -n 's/^target_feature="\(.*\)"$/\1/p' | paste -sd, -)
          echo "arch=$arch best_host_simd=$simd cpu=${model:-unknown} compiled_features=$features"
          {
            echo "### Drift runner"
            echo ""
            echo "- arch: \`$arch\`"
            echo "- best host SIMD flag: \`$simd\`"
            echo "- compiled target features (decide the SIMD path): \`$features\`"
            echo "- CPU: ${model:-unknown}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run drift harness tests with scenario summaries
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo ci-test-drift | tee drift-harness.log

      - name: Publish drift metrics summary
        if: always()
        shell: bash
        run: |
          [ -f drift-harness.log ] || exit 0
          # Tests run in parallel, so a line can start after another test's
          # output on the same line: match anywhere, keep from the tag on.
          results=$(grep -oE 'DRIFT_(SCENARIO|CONVERGENCE) .*' drift-harness.log || true)
          warnings=$(grep -oE 'DRIFT_WARNING .*' drift-harness.log || true)
          {
            echo "### Drift scenarios"
            echo ""
            echo '```'
            echo "${results:-no DRIFT_SCENARIO lines}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Metrics above 70% of their threshold pass, but are annotated so
          # shrinking margins are visible before they fail.
          if [ -n "$warnings" ]; then
            {
              echo ""
              echo "### Near-threshold warnings"
              echo ""
              echo '```'
              echo "$warnings"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while read -r line; do
              echo "::warning title=Drift metric near threshold::${line#DRIFT_WARNING }"
            done <<<"$warnings"
          fi

      - name: Upload drift harness log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-harness-log
          path: drift-harness.log
