cargo-features = ["profile-rustflags"]

[lints.rust]
# Add any custom lints here if needed

[package]
name = "rust_thermo"
version = "0.1.1"
edition = "2024"

[dependencies]
ggez = { version = "0.9.3", optional = true }
wgpu = { version = "0.16.3", optional = true }
rand = "0.9.0"
rand_distr = "0.5.1"
lru = "0.16.2"
rayon = "1.10.0"
wide = "0.8.2"
multiversion = "0.8.0"
num_cpus = "1.16"
#winit = "0.30.5"
#winit = "0.30.5"

[dev-dependencies]
float-cmp = "0.10"

[features]
default = ["renderer-ggez"]
measure-time = []
renderer-ggez = ["ggez"]
renderer-wgpu = ["wgpu"]

[profile.dev]
#opt-level = 2
debug = true
overflow-checks = true
debug-assertions = true
lto = false


[profile.release]
#debug = true
codegen-units = 1
lto = "fat"
rustflags = ["-C", "target-cpu=native"]
opt-level = 3
panic = "abort"
strip = "symbols"