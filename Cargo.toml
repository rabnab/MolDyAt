cargo-features = ["profile-rustflags"]
[unstable]
profile-rustflags = true

[package]
name = "rust_thermo"
version = "0.1.0"
edition = "2024"

[dependencies]
dtrace = "0.1.1"
ggez = { version = "0.9.3", optional = true }
wgpu = { version = "0.16", optional = true }
rand = "0.9.0"
rand_distr = "0.5.1"
#rayon = "1.10.0"
#winit = "0.30.5"
#winit = "0.30.5"

[dev-dependencies]
float-cmp = "0.10"

[features]
default = ["renderer-ggez"]
measure-time = []
renderer-ggez = ["ggez"]
renderer-wgpu = ["wgpu"]

[profile.dev]
opt-level = 2
debug = true
overflow-checks = true
debug-assertions = true
lto = false


[profile.release]
#debug = true
codegen-units = 1
lto = "fat"
rustflags = ["-C", "target-cpu=native"]
opt-level = 3
panic = "abort"
strip = "symbols"