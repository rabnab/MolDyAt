cargo-features = ["profile-rustflags"]

[workspace]
members = ["core", "wgpu_renderer"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2024"

[workspace.lints.rust]
# Add any custom lints here if needed

[profile.dev]
opt-level = 2
debug = true
overflow-checks = true
debug-assertions = true
lto = false

[profile.release]
#debug = true
codegen-units = 1
lto = "fat"
# Tune for the build host, but without AMX: on AMX-capable x86_64 hosts
# (e.g. Sapphire Rapids) `native` enables amx-tile/amx-int8, and dependencies
# such as scirs2-linalg then compile unstable AMX intrinsics and fail (E0658).
# Disabling amx-tile also disables the AMX extensions that depend on it. rustc
# warns once per crate that amx-tile is unstable (and, on non-x86 targets,
# unknown); the flag is a no-op there and NEON stays enabled on aarch64.
rustflags = ["-C", "target-cpu=native", "-C", "target-feature=-amx-tile"]
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
rustflags = ["-C", "target-cpu=x86-64-v2"]
