cargo-features = ["profile-rustflags"]

[workspace]
members = ["core", "wgpu_renderer"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.lints.rust]
# Add any custom lints here if needed

[profile.dev]
opt-level = 2
debug = true
overflow-checks = true
debug-assertions = true
lto = false

[profile.release]
#debug = true
codegen-units = 1
lto = "fat"
rustflags = ["-C", "target-cpu=native"]
opt-level = 3
panic = "abort"
strip = "symbols"
