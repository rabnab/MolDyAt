[package]
name = "moldyat_wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "moldyat"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
thermo_ui = { path = "../crates/thermo_ui", default-features = false }
thermo_physics = { path = "../crates/thermo_physics", default-features = false }
# Headless runs (#309)
thermo_runtime = { path = "../crates/thermo_runtime", default-features = false }

# WGPU rendering
wgpu = "30"
pollster = "1"
bytemuck = { version = "1.14", features = ["derive"] }
font8x8 = "0.3"

# Window management (same version as thermo_ui for energy window compat)
winit = "0.30.12"

# PNG icon loading
image = { version = "0.25", default-features = false, features = ["png"] }

# Logging (for init in main)
log = "0.4"

# Needed for rayon init in main
rayon = "1.10.0"
num_cpus = "1.16"

[features]
default = ["measure-time"]
# The F4 step-timing log of thermo_physics, passed on through thermo_ui and
# thermo_runtime. Off, the simulation results are identical (CI runs the
# headless fixtures both ways).
measure-time = ["thermo_ui/measure-time"]
