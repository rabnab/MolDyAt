[package]
name = "rust_thermo_wgpu"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
rust_thermo_core = { path = "../core" }

# WGPU rendering
wgpu = "28"
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
font8x8 = "0.3"

# Window management (same version as core for energy window compat)
winit = "0.30.12"

# PNG icon loading
image = { version = "0.25", default-features = false, features = ["png"] }

# Logging (for init in main)
log = "0.4"
serde_json = "1"

# Needed for rayon init in main
rayon = "1.10.0"
num_cpus = "1.16"
