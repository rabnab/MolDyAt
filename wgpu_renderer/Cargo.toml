[package]
name = "moldyat_wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "moldyat"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
moldyat_core = { path = "../core", default-features = false }

# WGPU rendering
wgpu = "30"
pollster = "1"
bytemuck = { version = "1.14", features = ["derive"] }
font8x8 = "0.3"

# Window management (same version as core for energy window compat)
winit = "0.30.12"

# PNG icon loading
image = { version = "0.25", default-features = false, features = ["png"] }

# Logging (for init in main)
log = "0.4"
serde_json = "1"

# Needed for rayon init in main
rayon = "1.10.0"
num_cpus = "1.16"

[features]
default = ["measure-time"]
# Forwards to core: the F4 step-timing log. Off, the simulation results are
# identical (CI runs the headless fixtures both ways).
measure-time = ["moldyat_core/measure-time"]
