[package]
name = "thermo_physics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MolDyAt simulation physics: particles, species, pair potentials, walls and operators, the world and its stepping, and saves. No windowing or GPU dependencies."

[lints]
workspace = true

[dependencies]
# Physics & simulation
rand = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.10.0"

# Save/load of the simulation world (#50)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_ignored = "0.1.14"
# Simulation config file (`--config`, #231)
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# Logging
log = "0.4"

# Plain-data layouts of the GPU force kernel's buffers (`thermo_gpu`)
bytemuck = { version = "1.14", features = ["derive"] }

[dev-dependencies]
float-cmp = "0.10"

# The drift suite on the GPU force pass (`scripts/drift_gpu.sh`): only with
# `--cfg gpu_drift`, so normal test builds have no GPU stack. `thermo_gpu`
# links the library build of this crate, named here to reach its traits.
[target.'cfg(gpu_drift)'.dev-dependencies]
thermo_gpu = { path = "../thermo_gpu" }
thermo_physics = { path = "." }

[features]
default = ["measure-time"]
measure-time = []
# Test builders and fault-injection knobs for the tests of dependent crates
# (enabled by their dev-dependencies only, never in a normal build).
test-support = []
