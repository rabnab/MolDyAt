[package]
name = "thermo_ui"
description = "MolDyAt user interface without a GPU backend: the event loop and input handling, operator tools, viewport, sidebar model and the energy plot window."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thermo_physics = { path = "../thermo_physics", default-features = false }
thermo_runtime = { path = "../thermo_runtime", default-features = false }

# Snapshot slot read by the renderer (`PhysicsCoordinator`)
arc-swap = "1.7"
# UI settings file (`ui.toml`: key bindings)
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Window management (energy plot uses softbuffer + winit)
winit = "0.30.12"
softbuffer = "0.4"

[dev-dependencies]
float-cmp = "0.10"

[features]
default = ["measure-time"]
# The F4 step-timing log of thermo_physics, passed on through thermo_runtime.
# No code in this crate uses it.
measure-time = ["thermo_runtime/measure-time"]
